<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実験観察記録 - 2日目</title>
    <style>
        /* 背景黒・文字白のベース設定 */
        body {
            font-family: "Courier New", Consolas, monospace, sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #000000;
            color: #ffffff;
        }
        h1 {
            border-bottom: 1px solid #ffffff;
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-weight: normal;
            font-size: 1.8em;
        }
        h3 {
            margin-top: 40px;
            border-bottom: 1px dashed #ffffff;
            display: inline-block;
            padding-bottom: 5px;
            font-weight: normal;
        }
        
        /* 記録データ用の表 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ffffff;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #1a1a1a;
            width: 25%;
            font-weight: normal;
        }

        /* テキストエリア（報告詳細など） */
        .details-section {
            border: 1px solid #ffffff;
            padding: 20px;
            margin-top: 20px;
            background-color: #0a0a0a;
        }
        .details-section h3 {
            margin-top: 0;
        }

        /* 画像ギャラリー */
        .images {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .images img {
            width: 100%;
            max-width: 260px;
            height: auto;
            border: 1px solid #ffffff;
            display: block;
        }

        /* ページ切り替えリンク */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #555555;
            flex-wrap: wrap;
        }
        .pagination a {
            display: inline-block;
            padding: 8px 16px;
            text-decoration: none;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
        }
        .pagination a:hover {
            background-color: #333333;
        }
        /* 現在のページは白黒反転 */
        .pagination a.current {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <h1>実験観察記録 - DAY 1</h1>

    <!-- 記録データ部分（表形式） -->
    <table>
        <tbody>
            <tr>
                <th>経過日数</th>
                <td>1日目</td>
            </tr>
            <tr>
                <th>観察日</th>
                <td>2026年11月16日</td>
            </tr>
            <tr>
                <th>実験内容</th>
                <td>○○の成長と変化についての継続観察</td>
            </tr>
            <tr>
                <th>環境条件</th>
                <td>天候: 晴れ / 気温: 20.5℃ / 湿度: 45%</td>
            </tr>
        </tbody>
    </table>

    <!-- 本文部分 -->
    <h3>実験内容の詳細</h3>
    <p>ここに実験の前提条件や、どのような手順で観察を行っているかを記載します。<br>
    （例：毎日午前10時に状態を記録し、特定溶液を5ml添加する）</p>

    <!-- 枠線で囲った結果報告部分 -->
    <div class="details-section">
        <h3>観察結果・気づいたこと</h3>
        <p>本日の状態や、前回と比べて変化した点などを記載します。目視での色調変化や、触診での硬度の違いなど、詳細なデータを記録してください。</p>
    </div>

    <!-- 画像部分 -->
    <h3>報告用画像</h3>
    <div class="images">
        <!-- 実際に表示させたい画像のファイル名に変更してください -->
        <img src="photo1.jpg" alt="観察画像1">
        <img src="photo2.jpg" alt="観察画像2">
        <img src="photo3.jpg" alt="観察画像3">
    </div>

    <!-- ページ切り替えリンク -->
    <div class="pagination">
        <a href="index.html">詳細データ</a>
        <a href="page1.html" class="current">1</a>
        <a href="page2.html">2</a>
        <a href="page3.html">3</a>
        <a href="page4.html">4</a>
        <a href="page5.html">5</a>
    </div>

</body>
</html>
